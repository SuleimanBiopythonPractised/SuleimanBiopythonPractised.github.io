<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 180" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- Cyan Glow & Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Emerald Green Gradient -->
    <linearGradient id="greenGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>

    <!-- Text Gradient for Biopython -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Icon Emblem (scaled 0.32 centered at x=90, y=90) -->
  <g transform="translate(15, 10) scale(0.31)">
    <!-- Tech Rim -->
    <circle cx="256" cy="256" r="236" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="5" />
    <circle cx="256" cy="256" r="232" fill="none" stroke="url(#cyanGrad)" stroke-width="2" stroke-dasharray="10 8" opacity="0.65" />
    
    <!-- Base Pair Rungs -->
    <g stroke-linecap="round" opacity="0.85">
      <line x1="205" y1="120" x2="307" y2="120" stroke="#06b6d4" stroke-width="4" stroke-dasharray="6 5" />
      <circle cx="205" cy="120" r="7" fill="#38bdf8" filter="url(#neonGlow)" />
      <circle cx="307" cy="120" r="7" fill="#34d399" filter="url(#neonGlow)" />

      <line x1="230" y1="170" x2="282" y2="170" stroke="#0ea5e9" stroke-width="4" />
      <circle cx="230" cy="170" r="6" fill="#38bdf8" />
      <circle cx="282" cy="170" r="6" fill="#34d399" />

      <circle cx="256" cy="225" r="9" fill="#ffffff" filter="url(#neonGlow)" />
      
      <line x1="225" y1="285" x2="287" y2="285" stroke="#10b981" stroke-width="4" />
      <circle cx="225" cy="285" r="6" fill="#38bdf8" />
      <circle cx="287" cy="285" r="6" fill="#34d399" />

      <line x1="195" y1="340" x2="317" y2="340" stroke="#10b981" stroke-width="4" stroke-dasharray="6 5" />
      <circle cx="195" cy="340" r="7" fill="#38bdf8" filter="url(#neonGlow)" />
      <circle cx="317" cy="340" r="7" fill="#34d399" filter="url(#neonGlow)" />
    </g>

    <!-- Strands -->
    <path d="M 195 90 C 160 140, 220 200, 256 225 C 292 250, 350 310, 315 365 C 285 415, 235 410, 205 435"
          fill="none" stroke="url(#cyanGrad)" stroke-width="18" stroke-linecap="round" filter="url(#neonGlow)" />
    <path d="M 315 90 C 350 140, 290 200, 256 225 C 220 250, 160 310, 195 365 C 225 415, 275 410, 305 435" 
          fill="none" stroke="url(#greenGrad)" stroke-width="18" stroke-linecap="round" filter="url(#neonGlow)" />

    <circle cx="195" cy="80" r="14" fill="url(#cyanGrad)" filter="url(#neonGlow)" />
    <circle cx="315" cy="80" r="14" fill="url(#greenGrad)" filter="url(#neonGlow)" />
  </g>

  <!-- Typography -->
  <g transform="translate(195, 0)">
    <!-- Main Title -->
    <text x="0" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="800" font-size="44" fill="#ffffff" letter-spacing="-0.5">
      Suleiman<tspan fill="url(#textGrad)">Biopython</tspan><tspan fill="#e2e8f0" font-weight="500">Practised</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="2" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="14.5" fill="#94a3b8" letter-spacing="3.2">
      COMPUTATIONAL BIOLOGY • BIOSTATISTICS • GENOMIC PIPELINES
    </text>

    <!-- Accent underline pill -->
    <rect x="2" y="140" width="110" height="3.5" rx="1.75" fill="url(#cyanGrad)" />
    <rect x="118" y="140" width="45" height="3.5" rx="1.75" fill="url(#greenGrad)" />
  </g>
</svg>